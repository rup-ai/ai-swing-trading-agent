
name: RupAI Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Run all tests
        run: |
          python -m tests.test_market_api
          python -m tests.test_data_normalizer
          python -m tests.test_technical_indicators
          python -m tests.test_trend_analysis
          python -m tests.test_stock_analyzer
          python -m tests.test_stock_scorer
          python -m tests.test_stock_ranker
          python -m tests.test_market_scanner
          python -m tests.test_report_formatter
          python -m tests.test_main_pipeline
          python -m tests.test_telegram_alert
          python -m tests.test_nse_universe
